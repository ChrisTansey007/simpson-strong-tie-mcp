[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simpson-strong-tie-mcp-workspace"
version = "0.1.0"
description = "Simpson Strong-Tie Expert Knowledge & Engineering MCP Server Workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27.0,<2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "structlog>=24.1.0",
    "orjson>=3.9.15",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "simpson-common",
    "simpson-domain",
    "simpson-persistence",
    "simpson-provenance",
    "simpson-ingestion",
    "simpson-retrieval",
    "simpson-engineering",
    "simpson-storage",
    "simpson-testing",
    "simpson-api",
    "simpson-mcp",
    "simpson-worker",
]

[project.scripts]
simpson-api = "simpson_api.main:run_server"
simpson-mcp = "simpson_mcp.main:run_server"
simpson-worker = "simpson_worker.main:run_worker"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/api",
    "apps/mcp",
    "apps/worker",
]

[tool.uv.sources]
simpson-common = { workspace = true }
simpson-domain = { workspace = true }
simpson-persistence = { workspace = true }
simpson-provenance = { workspace = true }
simpson-ingestion = { workspace = true }
simpson-retrieval = { workspace = true }
simpson-engineering = { workspace = true }
simpson-storage = { workspace = true }
simpson-testing = { workspace = true }
simpson-api = { workspace = true }
simpson-mcp = { workspace = true }
simpson-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "hypothesis>=6.99.0",
    "testcontainers>=4.0.0",
    "ruff>=0.3.0",
    "pyright>=1.1.353",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TC"]
ignore = ["E501"]

[tool.pyright]
include = ["packages", "apps"]
exclude = ["**/node_modules", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages", "apps", "tests"]
asyncio_mode = "auto"
