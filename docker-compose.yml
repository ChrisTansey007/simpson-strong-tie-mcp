version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16  # PostgreSQL 16/18 with pgvector extension pre-installed
    container_name: simpson_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simpson_mcp}
      POSTGRES_USER: ${POSTGRES_USER:-simpson}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simpson_dev_password}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simpson} -d ${POSTGRES_DB:-simpson_mcp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: simpson_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    profiles:
      - minio

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: simpson_api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-simpson}:${POSTGRES_PASSWORD:-simpson_dev_password}@postgres:5432/${POSTGRES_DB:-simpson_mcp}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    container_name: simpson_mcp
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-simpson}:${POSTGRES_PASSWORD:-simpson_dev_password}@postgres:5432/${POSTGRES_DB:-simpson_mcp}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: simpson_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-simpson}:${POSTGRES_PASSWORD:-simpson_dev_password}@postgres:5432/${POSTGRES_DB:-simpson_mcp}
    depends_on:
      postgres:
        condition: service_healthy

  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
    container_name: simpson_admin_web
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
